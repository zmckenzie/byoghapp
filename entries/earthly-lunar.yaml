# yaml-language-server: $schema=../schema/entry.schema.json
slug: earthly-lunar
name: Earthly Lunar
vendor: Earthly Technologies
category: other
website: https://earthly.dev/lunar
documentation_url: https://docs-lunar.earthly.dev/install/git-platforms/github
own_app: required
supports:
  user: false
  org: true
  enterprise: false
  ghes: true
install_scope:
  repositories: either
  level: org
  notes: >-
    The docs recommend All repositories; Lunar's monitoring scope is set in lunar-config.yml.
credentials_needed:
  - app_id
  - installation_id
  - private_key
two_step_webhook: false
manual_steps:
  - Generate a private key and save the .pem file; GitHub shows it only once.
  - >-
    Install the app on your organization, then give the Hub the owner, app ID, installation ID and
    Base64-encoded private key.
  - >-
    Optional: enable Device Flow and add a client secret and Grafana callback URL if the same app
    should handle CLI and dashboard sign-in.
notes: >-
  The docs list the push, pull_request, workflow_run and issue_comment events but also say to
  uncheck Active, because the Hub registers its own repository and organization webhooks at runtime.
  This entry follows the inactive webhook and subscribes to no events. issue_comment would also need
  the Issues permission, which the docs don't request.
manifest:
  name: Lunar
  url: https://earthly.dev/lunar
  hook_attributes:
    url: https://example.invalid/webhook-not-used
    active: false
  public: false
  default_permissions:
    actions: read
    checks: write
    contents: read
    metadata: read
    organization_hooks: write
    pull_requests: write
    repository_hooks: write
  default_events: []
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

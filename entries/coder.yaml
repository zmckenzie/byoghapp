# yaml-language-server: $schema=../schema/entry.schema.json
slug: coder
name: Coder (external auth)
vendor: Coder Technologies
category: other
website: https://coder.com
documentation_url: https://coder.com/docs/admin/external-auth
own_app: required
supports:
  user: false
  org: true
  enterprise: false
  ghes: true
install_scope:
  repositories: either
  level: org
credentials_needed:
  - client_id
  - client_secret
two_step_webhook: false
manual_steps:
  - >-
    Set the callback URL to https://<coder-host>/external-auth/<id>/callback, where <id> matches
    CODER_EXTERNAL_AUTH_0_ID (for example primary-github).
  - >-
    Set CODER_EXTERNAL_AUTH_0_ID, CODER_EXTERNAL_AUTH_0_TYPE=github, CODER_EXTERNAL_AUTH_0_CLIENT_ID
    and CODER_EXTERNAL_AUTH_0_CLIENT_SECRET on the Coder control plane.
  - Install the app on your organization; you may select a subset of repositories.
  - >-
    For users outside the owning account to link GitHub, the docs say to make the app public and set
    CODER_EXTERNAL_AUTH_0_APP_INSTALL_URL to the app's installations/new URL.
notes: >-
  The docs give the permission table as an example that lets users clone repositories, and say you
  can use more or fewer permissions. The section is headed "Configure a GitHub OAuth app"; Coder
  also works with OAuth apps. For GitHub Enterprise Server, also set the AUTH, TOKEN and VALIDATE
  URLs.
manifest:
  name: Coder
  url: https://coder.com
  hook_attributes:
    url: https://example.invalid/webhook-not-used
    active: false
  public: false
  default_permissions:
    contents: write
    members: read
    metadata: read
    pull_requests: write
    workflows: write
  default_events: []
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

# yaml-language-server: $schema=../schema/entry.schema.json
slug: bulldozer
name: bulldozer
vendor: Palantir
category: ci-cd
website: https://github.com/palantir/bulldozer
documentation_url: https://github.com/palantir/bulldozer#github-app-configuration
documentation_urls:
  - https://github.com/palantir/bulldozer/blob/develop/config/bulldozer.example.yml
own_app: required
supports:
  user: false
  org: true
  enterprise: false
  ghes: true
install_scope:
  repositories: either
  level: org
credentials_needed:
  - app_id
  - private_key
  - webhook_secret
two_step_webhook: true
manual_steps:
  - >-
    Set the webhook URL to https://<your-bulldozer-domain>/api/github/hook and a webhook secret
    matching github.app.webhook_secret in the server configuration.
  - >-
    Put the App ID in github.app.integration_id and the private key in github.app.private_key. For
    GitHub Enterprise Server, set v3_api_url to https://<your-ghes-host>/api/v3.
notes: >-
  Self-hosted server from Palantir's open-source repository. The README lists the permissions and
  events; the example configuration documents the GitHub Enterprise Server API URL and the App ID,
  webhook secret and private key settings.
manifest:
  name: bulldozer
  url: https://github.com/palantir/bulldozer
  hook_attributes:
    url: https://example.invalid/bulldozer-api-github-hook
    active: true
  public: false
  default_permissions:
    administration: read # "Repository administration: Read-only"
    checks: read # "Checks: Read-only"
    contents: write # "Repository contents: Read & write"
    issues: write # "Issues: Read & write"
    metadata: read # "Repository metadata: Read-only"
    pull_requests: write # "Pull requests: Read & write"
    statuses: read # "Commit status: Read-only"
  default_events:
    - check_run
    - commit_comment
    - issue_comment
    - pull_request
    - pull_request_review
    - pull_request_review_comment
    - push
    - status
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-16
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-16. Awaiting maintainer
      verification.

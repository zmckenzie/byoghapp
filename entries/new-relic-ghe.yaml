# yaml-language-server: $schema=../schema/entry.schema.json
slug: new-relic-ghe
name: New Relic Service Architecture Intelligence (GitHub Enterprise)
vendor: New Relic
category: dev-portal
website: https://newrelic.com
documentation_url: >-
  https://docs.newrelic.com/docs/service-architecture-intelligence/github-integrations/github-enterprise-integration/
own_app: ghes-only
supports:
  user: false
  org: true
  enterprise: false
  ghes: true
install_scope:
  repositories: either
  level: org
credentials_needed:
  - app_id
  - private_key
  - webhook_secret
two_step_webhook: true
manual_steps:
  - >-
    Set the webhook URL to your collector service:
    https://<your-collector-host>/github/sync/webhook, with an event secret of 32+ characters.
  - >-
    Generate a private key, convert it to DER and Base64-encode it for GITHUB_APP_PRIVATE_KEY; pass
    the app ID and webhook secret as GITHUB_APP_ID and GITHUB_APP_WEBHOOK_SECRET.
  - >-
    Deploy the nr-ghe-collector Docker image inside your network, then install the app on each
    organization to integrate.
notes: >-
  Preview feature. The docs mark Commit statuses, Contents, Custom properties (repository) and Pull
  requests as "Selected" without an access level, so this entry leaves them out; add them by hand.
  Because of that, the docs' commit_comment, create, delete, fork, push, release, milestone,
  pull_request, pull_request_review, pull_request_review_comment, pull_request_review_thread and
  status events are left out too (they need Contents, Pull requests or Commit statuses). The docs
  also list installation_target, which GitHub sends automatically and cannot be subscribed to.
manifest:
  name: New Relic
  url: https://newrelic.com
  hook_attributes:
    url: https://example.invalid/replace-with-your-webhook-url
    active: true
  public: false
  default_permissions:
    administration: read
    checks: read
    deployments: read
    members: read
    metadata: read
    organization_administration: read
    organization_custom_org_roles: read
    organization_custom_properties: read
    organization_custom_roles: read
    organization_events: read
    organization_hooks: read
    repository_hooks: read
  default_events:
    - check_run
    - check_suite
    - custom_property
    - custom_property_values
    - deployment
    - deployment_review
    - deployment_status
    - label
    - member
    - membership
    - meta
    - organization
    - public
    - repository
    - star
    - team
    - team_add
    - watch
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

# yaml-language-server: $schema=../schema/entry.schema.json
slug: codefresh
name: Codefresh
vendor: Codefresh
category: ci-cd
website: https://codefresh.io
documentation_url: https://codefresh.io/docs/docs/integrations/git-providers/
own_app: optional
supports:
  user: true
  org: true
  enterprise: false
  ghes: false
install_scope:
  repositories: either
  level: org-or-user
credentials_needed:
  - app_id
  - installation_id
  - private_key
two_step_webhook: false
manual_steps:
  - >-
    Note the app ID, generate a private key, then install the app and choose the repositories
    Codefresh may access.
  - Note the installation ID from the end of the installation URL.
  - >-
    In Codefresh, add a Git provider of type Github App with the installation ID, app ID and
    base64-encoded private key.
notes: >-
  The docs describe Codefresh's own Marketplace app with read and write access to code; the manual
  app they describe asks only for Contents read-only.
manifest:
  name: codefresh-integration
  url: https://codefresh.io
  hook_attributes:
    url: https://example.invalid/webhook-not-used
    active: false
  public: false
  default_permissions:
    contents: read
    emails: read
    issues: read
    metadata: read
    pull_requests: read
    repository_hooks: write
    statuses: write
  default_events: []
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

# yaml-language-server: $schema=../schema/entry.schema.json
slug: repository-settings-self-hosted
name: Repository Settings app (self-hosted)
vendor: repository-settings (Probot Settings)
category: other
website: https://github.com/repository-settings/app
documentation_url: https://github.com/repository-settings/app/blob/master/docs/self-host.md
own_app: required
supports:
  user: false
  org: true
  enterprise: false
  ghes: false
install_scope:
  repositories: either
  level: org
credentials_needed:
  - app_id
  - private_key
  - webhook_secret
two_step_webhook: true
manual_steps:
  - Set the Single file path to .github/settings.yml.
  - >-
    Set the webhook URL to your own deployment and a webhook secret, then run the app with APP_ID,
    PRIVATE_KEY and WEBHOOK_SECRET.
notes: >-
  Self-hosted instance of the settings app known as Probot Settings; the probot/settings repository
  serves the same self-host page. The docs pass GH_API as the Octokit base URL but
  don't say whether GitHub Enterprise Server is supported.
manifest:
  name: Repository Settings
  url: https://github.com/repository-settings/app
  hook_attributes:
    url: https://example.invalid/repository-settings-webhook
    active: true
  public: false
  default_permissions:
    actions: read # "Actions: Read only"
    administration: write # "Administration: Read & Write"
    contents: read # "Contents: Read only"
    issues: write # "Issues: Read & Write"
    members: write # Organization: "Members: Read & Write"
    metadata: read
    single_file: write # "Single file: Read & Write, Path: .github/settings.yml"
  default_events:
    - push
    - repository
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-16
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-16. Awaiting maintainer
      verification.

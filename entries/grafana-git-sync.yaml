# yaml-language-server: $schema=../schema/entry.schema.json
slug: grafana-git-sync
name: Grafana Git Sync
vendor: Grafana Labs
category: observability
website: https://grafana.com
documentation_url: >-
  https://grafana.com/docs/grafana/latest/as-code/observability-as-code/git-sync/git-sync-setup/set-up-before/
own_app: optional
supports:
  user: true
  org: true
  enterprise: false
  ghes: false
install_scope:
  repositories: either
  level: org-or-user
credentials_needed:
  - app_id
  - installation_id
  - private_key
two_step_webhook: false
manual_steps:
  - Generate a private key and copy the app ID from the About section.
  - >-
    Install the app, choose the repositories, and copy the installation ID from the end of the
    installation page URL.
  - >-
    Continue with Set up Git Sync in Grafana and enter the app ID, private key and installation ID.
notes: >-
  The docs call these instructions informative and point to GitHub's documentation. Administration
  read-only is used to validate branch protection rules. The app name must be unique.
manifest:
  name: Grafana Git Sync
  url: https://grafana.com
  hook_attributes:
    url: https://example.invalid/webhook-not-used
    active: false
  public: false
  default_permissions:
    administration: read
    contents: write
    metadata: read
    pull_requests: write
    repository_hooks: write
  default_events: []
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

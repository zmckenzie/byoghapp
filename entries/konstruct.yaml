# yaml-language-server: $schema=../schema/entry.schema.json
slug: konstruct
name: Konstruct
vendor: Civo
category: gitops
website: https://www.civo.com/konstruct
documentation_url: https://konstruct.civo.com/docs/admin/github-app-setup
own_app: required
supports:
  user: true
  org: true
  enterprise: false
  ghes: false
install_scope:
  repositories: either
  level: org-or-user
  notes: >-
    Choose Any account for shared instances used by several organizations, or Only on this account
    for a single organization.
credentials_needed:
  - app_id
  - client_id
  - client_secret
  - private_key
two_step_webhook: false
manual_steps:
  - >-
    Set the homepage URL to your Konstruct instance URL and the callback URL to
    https://<YOUR_DOMAIN>/api/v1/github-app/callback.
  - >-
    Enable "Expire user authorization tokens" and "Request user authorization (OAuth) during
    installation"; leave Device Flow disabled.
  - Generate a client secret and a private key, and note the app ID and app slug.
  - >-
    Store GITHUB_APP_ID, GITHUB_APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET, GITHUB_APP_NAME and
    GITHUB_APP_PRIVATE_KEY in Vault for the Konstruct API.
notes: >-
  Each self-hosted Konstruct instance needs its own app. The docs say not to grant more than the
  listed permissions.
manifest:
  name: Konstruct
  url: https://www.civo.com/konstruct
  hook_attributes:
    url: https://example.invalid/webhook-not-used
    active: false
  public: false
  default_permissions:
    actions: write
    administration: write
    contents: write
    emails: read
    members: read
    metadata: read
    organization_administration: read
    organization_self_hosted_runners: write
    pull_requests: write
    secrets: write
    workflows: write
  default_events: []
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

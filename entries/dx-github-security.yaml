# yaml-language-server: $schema=../schema/entry.schema.json
slug: dx-github-security
name: DX GitHub Security connector
vendor: DX
category: eng-intelligence
website: https://getdx.com
documentation_url: https://docs.getdx.com/connectors/github-security/
own_app: required
supports:
  user: false
  org: true
  enterprise: true
  ghes: true
install_scope:
  repositories: either
  level: org
  notes: >-
    DX suggests starting with your most important repositories and adding more later.
credentials_needed:
  - app_id
  - private_key
two_step_webhook: false
manual_steps:
  - Enable DX's GitHub connector first.
  - Generate a private key and enter it with the app ID in DX under Connections.
  - >-
    Optional: add Code quality (read-only) if you enable DX's GitHub Code Quality schema; an
    organization owner must approve the change.
notes: >-
  DX's own launch link creates an enterprise-owned app on GitHub Enterprise Cloud. Code quality is
  not available on GitHub Enterprise Server.
manifest:
  name: DX - GitHub Security
  url: https://getdx.com
  hook_attributes:
    url: https://example.invalid/webhook-not-used
    active: false
  public: false
  default_permissions:
    members: read
    metadata: read
    secret_scanning_alerts: read
    security_events: read
    vulnerability_alerts: read
  default_events: []
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

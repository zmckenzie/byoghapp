# yaml-language-server: $schema=../schema/entry.schema.json
slug: github-for-jira-ghes
name: GitHub for Jira (GitHub Enterprise Server)
vendor: Atlassian
category: other
website: https://www.atlassian.com/software/jira
documentation_url: >-
  https://support.atlassian.com/jira-cloud-administration/docs/manually-create-a-github-app/
own_app: ghes-only
supports:
  user: true
  org: true
  enterprise: false
  ghes: true
install_scope:
  repositories: either
  level: org-or-user
credentials_needed:
  - app_id
  - client_id
  - client_secret
  - private_key
  - webhook_secret
two_step_webhook: true
manual_steps:
  - >-
    Use this manual flow for GitHub Enterprise Server 2.18 or lower. On 2.19 or higher, Jira creates
    the app for you when you connect GitHub.
  - >-
    In Jira, select Manual app creation, then copy its User Authorization Callback URL, Setup URL
    and Webhook URL into the matching fields of the app.
  - Set a webhook secret, and use the same app name and webhook secret in Jira.
  - >-
    Enter the app ID, client ID, a new client secret and the private key (.pem file) in Jira.
notes: >-
  The docs say read and write access is optional, but the create branch feature does not work
  without it. They suggest a homepage URL of the form http(s)://<your-domain>/apps/<app-name>.
manifest:
  name: Jira
  url: https://www.atlassian.com/software/jira
  hook_attributes:
    url: https://example.invalid/replace-with-your-webhook-url
    active: true
  public: false
  default_permissions:
    actions: read
    contents: write
    deployments: read
    issues: write
    members: read
    metadata: read
    pull_requests: write
  default_events:
    - commit_comment
    - create
    - delete
    - deployment_status
    - issue_comment
    - issues
    - pull_request
    - pull_request_review
    - push
    - repository
    - security_advisory
    - workflow_run
last_verified: null
verified_by: null
verification:
  status: needs-review
  method: doc-hash
  doc_hash: null
changelog:
  - date: 2026-10-15
    version: 1.0.0
    author: zmckenzie
    summary: >-
      Initial entry from the vendor's documentation, read on 2026-10-15. Awaiting maintainer
      verification.

# Risk tiers are byoghapp's own model; GitHub does not rank permissions. Keys and levels come from
# GitHub's REST OpenAPI description (app-permissions) and the 'Permissions required for GitHub
# Apps' docs. Edit by hand; keep keys sorted.

tiers:
  critical:
    rank: 4
    label: Critical
    summary: Can change who has access, read or set secrets, or run code through Actions.
  high:
    rank: 3
    label: High
    summary: Can change code, merge gates, deployments or security findings.
  medium:
    rank: 2
    label: Medium
    summary: Can read source code or sensitive security and organization data.
  low:
    rank: 1
    label: Low
    summary: Mostly public or structural data.
permissions:
  actions:
    name: Actions
    scope: repository
    levels:
      read:
        tier: low
        blast_radius: Read GitHub Actions workflow runs, artifacts and caches.
      write:
        tier: critical
        blast_radius: Read and change GitHub Actions workflow runs, artifacts and caches.
    docs_url: >-
      https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-actions
  actions_variables:
    name: Variables
    scope: repository
    levels:
      read:
        tier: medium
        blast_radius: Read repository Actions variables.
      write:
        tier: high
        blast_radius: Read and change repository Actions variables.
    docs_url: >-
      https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-variables
    source: docs
  administration:

# Release: publishes a version once a maintainer has approved it twice.
#
#   1. Merging the release pull request (see release-pr.yml) changes the version
#      in package.json on main. That push runs this workflow.
#   2. The build job runs the checks and tests, builds the site reproducibly and
#      packages it, and shows the version and release notes in its summary.
#   3. The publish job runs in the "release" environment, which waits for a
#      maintainer to approve it. Only then does it sign SLSA build provenance
#      with Sigstore and publish the release; the v<version> tag is created at
#      the commit that was built.
#
# Any other push to main plans "none" or "pending" and stops after planning. Run
# this workflow by hand on main to publish a version that has no release yet
# (the first release, or one whose approval expired).
#
# Release assets:
#   byoghapp-site-<version>.tar.gz     the site, ready to serve (registry.json included)
#   byoghapp-registry-<version>.json   the registry data on its own
#   SHA256SUMS                         checksums of the two files above
#   byoghapp-<version>.intoto.jsonl    the signed provenance (one Sigstore bundle per line)
#
# Verify with `gh attestation verify <file> --repo zmckenzie/byoghapp`; see SECURITY.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Plan and build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History and tags: contributors, release notes and the previous release.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # A release never reads a cache other workflows can write.
          package-manager-cache: false

      - name: Plan
        id: plan
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
        run: |
          # shellcheck disable=SC2086 # MANUAL is empty or one flag
          node scripts/release.mjs plan ${MANUAL} --notes release-notes.md

      - name: Check, test and build
        if: steps.plan.outputs.action == 'publish'
        run: |
          # The commit time fixes generated_at, so the build is reproducible.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          npm run check
          npm test

      - name: Package
        if: steps.plan.outputs.action == 'publish'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          name="byoghapp-site-${VERSION}"
          mkdir -p dist/stage
          cp -R site "dist/stage/${name}"
          # Sorted names, fixed times, owners and modes, and no gzip timestamp:
          # the same commit always gives the same archive.
          tar --sort=name --format=posix \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C dist/stage -cf - "${name}" | gzip -9 -n > "dist/${name}.tar.gz"
          cp site/registry.json "dist/byoghapp-registry-${VERSION}.json"
          rm -rf dist/stage
          (cd dist && sha256sum byoghapp-* > SHA256SUMS)
          {
            echo "## Release v${VERSION} is waiting for approval"
            echo
            echo "Approve the \`release\` environment to sign and publish it."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release assets
        if: steps.plan.outputs.action == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    if: needs.build.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits here until a maintainer approves the environment.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      # Creates the release, its assets and its tag.
      contents: write
      # Sigstore signing with the workflow's OIDC identity.
      id-token: write
      # Stores the attestation, for `gh attestation verify`.
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .

      # The release creates its own tag. A v<version> tag that already exists was
      # made by someone else (tag creation can't be limited to this workflow) and
      # may point at a different commit than the one built, so stop.
      - name: Check the tag is free
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}" --jq '.[].ref')"
          if grep -Fqx "refs/tags/v${VERSION}" <<< "${existing}"; then
            echo "::error::Tag v${VERSION} already exists, but only this workflow should create it. Nothing was published; find out who created the tag before releasing."
            exit 1
          fi

      - name: Sign build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The .intoto.jsonl name is how OpenSSF Scorecard finds provenance, and
          # `gh attestation verify --bundle` reads it as JSON lines.
          jq -c . "${BUNDLE}" > "dist/byoghapp-${VERSION}.intoto.jsonl"
          # Draft first so every asset is attached before the release goes public
          # (required with immutable releases). Publishing the draft creates the
          # tag at the commit that was built.
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --draft \
            --title "byoghapp ${VERSION}" --notes-file release-notes.md
          gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Check the tag points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tagged="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq '.object.sha')"
          if [ "${tagged}" != "${GITHUB_SHA}" ]; then
            echo "::error::v${VERSION} points at ${tagged}, not the built commit ${GITHUB_SHA}. Investigate before anyone uses this release."
            exit 1
          fi
          echo "v${VERSION} -> ${tagged}"

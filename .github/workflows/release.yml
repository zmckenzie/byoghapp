# Release: when a maintainer pushes a version tag (v1.2.3) that matches
# package.json, this builds the site reproducibly, packages it, signs SLSA build
# provenance for every asset with Sigstore, and publishes a GitHub Release.
#
# Release assets:
#   byoghapp-site-<version>.tar.gz     the site, ready to serve (registry.json included)
#   byoghapp-registry-<version>.json   the registry data on its own
#   SHA256SUMS                         checksums of the two files above
#   byoghapp-<version>.sigstore.json   the signed provenance (Sigstore bundle)
#
# Verify with `gh attestation verify <file> --repo zmckenzie/byoghapp`; see SECURITY.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: contributors are read from git log.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # A release never reads a cache other workflows can write.
          package-manager-cache: false

      - name: Check the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check, test and build
        run: |
          # The commit time fixes generated_at, so the build is reproducible.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          npm run check
          npm test

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          name="byoghapp-site-${VERSION}"
          mkdir -p dist/stage
          cp -R site "dist/stage/${name}"
          # Sorted names, fixed times, owners and modes, and no gzip timestamp:
          # the same commit always gives the same archive.
          tar --sort=name --format=posix \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C dist/stage -cf - "${name}" | gzip -9 -n > "dist/${name}.tar.gz"
          cp site/registry.json "dist/byoghapp-registry-${VERSION}.json"
          rm -rf dist/stage
          (cd dist && sha256sum byoghapp-* > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and uploads its assets.
      contents: write
      # Sigstore signing with the workflow's OIDC identity.
      id-token: write
      # Stores the attestation, for `gh attestation verify`.
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Sign build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE}" "dist/byoghapp-${VERSION}.sigstore.json"
          # Draft first so every asset is attached before the release goes public
          # (required when immutable releases are enabled).
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --draft \
            --title "byoghapp ${VERSION}" --generate-notes
          gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

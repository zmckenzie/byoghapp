# Pull request titles must be conventional commits ("feat(entries): add X"). They
# become the squash-merge commit subjects on main, which decide the next version
# and the release notes (scripts/lib/conventional.mjs). The Release PR workflow
# starts this check by dispatch on its own pull request.
name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      title:
        description: Pull request title to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title || inputs.title }}
        run: node scripts/check-pr-title.mjs

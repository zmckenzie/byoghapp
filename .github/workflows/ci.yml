name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # Re-run on a branch after the /verified bot pushes to it (pushes made with
  # GITHUB_TOKEN don't trigger workflows on their own).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Repository hygiene (no scratch files, secrets or npm artifacts)
        run: node scripts/check-repo-hygiene.mjs

      - name: Validate entries
        run: node scripts/validate.mjs

      - name: Build the registry
        run: node scripts/build.mjs

      - name: Lint the site (CSP, no third-party requests)
        run: node scripts/lint-site.mjs

      - name: Unit tests with coverage (90% minimum)
        run: npm run coverage

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Browser tests and browser coverage (90% minimum)
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export CHROME_PATH
          npm run test:e2e
        env:
          E2E_REQUIRE_BROWSER: "1"

  workflow-lint:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          # Report in the job log and fail on findings; SARIF upload to code scanning
          # needs a public repository (or GitHub Advanced Security).
          advanced-security: false

# ClusterFuzzLite: builds the Jazzer.js fuzz targets in fuzz/ (see
# .clusterfuzzlite/) and fuzzes them for 5 minutes on every pull request, and
# for 30 minutes on main every week. Crashes fail the job and are uploaded as
# artifacts; add the input to test/fuzz/targets.test.mjs when you fix one.
name: ClusterFuzzLite

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Reads earlier runs' corpus and build artifacts.
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          sanitizer: none
          github-token: ${{ github.token }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          sanitizer: none
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 1800 }}
          github-token: ${{ github.token }}

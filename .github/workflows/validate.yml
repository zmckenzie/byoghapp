# Pull-request rules for registry entries that need history and the network:
# changelog lines, PR author attribution, maintainer-only verification, and
# documentation links that load and name the vendor.
name: Validate entries

on:
  # No path filter, so this can be a required check on every pull request.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate changed entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          args=(--base "origin/${BASE_REF}" --online)
          if [ -n "${PR_AUTHOR}" ]; then args+=(--pr-author "${PR_AUTHOR}"); fi
          node scripts/validate.mjs "${args[@]}"

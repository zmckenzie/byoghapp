# Mutation testing: checks that the tests actually catch bugs, not just run code.
# Pull requests test only the source files they change; the weekly run tests all.
name: Mutation testing

on:
  pull_request:
    paths:
      - "scripts/**"
      - "site/lib/**"
      - "test/scripts/**"
      - "test/site/**"
      - "fuzz/**"
      - "test/fuzz/**"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # A full run (about 2,600 mutants) takes about 5 minutes on 4 cores;
    # pull requests only test the files they change.
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run mutation tests
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          args=(--report mutation-report.json)
          if [ -n "${BASE_REF}" ]; then args+=(--changed "origin/${BASE_REF}"); fi
          node scripts/mutation.mjs "${args[@]}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: ignore
          retention-days: 14

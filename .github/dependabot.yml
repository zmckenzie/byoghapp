# The project has zero npm dependencies; GitHub Actions are its only external
# dependencies. Dependabot keeps the SHA pins (and version comments) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

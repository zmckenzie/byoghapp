name: Request a new entry
description: Ask for a product that needs a customer-created GitHub App to be added to the registry.
title: "Add entry: "
labels: ["new-entry", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Want to add it yourself? See CONTRIBUTING.md; an entry is a single YAML file.
  - type: input
    id: product
    attributes:
      label: Product name
      placeholder: Atlantis
    validations:
      required: true
  - type: input
    id: doc_url
    attributes:
      label: Vendor documentation URL
      description: The vendor's own page that explains how to create the GitHub App.
      placeholder: https://www.runatlantis.io/docs/access-credentials
    validations:
      required: true
  - type: dropdown
    id: own_app
    attributes:
      label: Does the product require its own GitHub App?
      options:
        - Required
        - Optional (alongside a PAT or a vendor-owned app)
        - GitHub Enterprise Server only
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: permissions_listed
    attributes:
      label: Does the documentation list the required permissions?
      options:
        - "Yes"
        - Partially
        - "No"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Enterprise or GHES caveats, webhook requirements, contradictions in the docs.

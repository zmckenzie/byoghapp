name: Feature request
description: Suggest an improvement to the site, schema or tooling.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that byoghapp doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: See AGENTS.md for the design rules.
      options:
        - label: This doesn't need a new dependency, third-party request or secret, or I explain why it should.
          required: true

name: Bug report
description: Something in the byoghapp site or tooling doesn't work.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs in the site, launchers, validator or automation.
        For a wrong or outdated registry entry, use **Report a problem with an entry** instead.
        **Security issues must be reported privately**; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Pick target "organization" …
        3. Click "Open in GitHub" …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / Node version
      placeholder: Firefox 140 on macOS 15, Node 22.11
  - type: textarea
    id: logs
    attributes:
      label: Console output or logs
      description: Remove any private keys, secrets or tokens first.
      render: text
